<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mentat</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Shown until the user is signed in -->
  <div id="login-view" hidden>
    <header class="header">
      <h1 class="title">Mentat</h1>
    </header>
    <main class="content">
      <form id="login-form" class="form" novalidate>
        <p class="hint" id="login-hint">Log in to start saving to your brain.</p>

        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" spellcheck="false" />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" />

        <div id="confirm-field" hidden>
          <label for="confirm-password">Repeat password</label>
          <input id="confirm-password" type="password" autocomplete="new-password" />
        </div>

        <button class="primary" id="login-submit" type="submit">Log in</button>
        <button class="google" id="google-login" type="button" hidden>Continue with Google</button>
        <button class="link" id="toggle-mode" type="button">Create an account</button>
        <p class="message" id="login-message" role="status" aria-live="polite"></p>
      </form>
    </main>
  </div>

  <!-- Shown once signed in -->
  <div id="app-view" hidden>
    <header class="header">
      <h1 class="title">Mentat</h1>
      <nav class="tabs" role="tablist" aria-label="Screens">
        <button class="tab" role="tab" id="tab-ask" data-screen="ask" aria-controls="screen-ask" type="button">Ask</button>
        <button class="tab" role="tab" id="tab-settings" data-screen="settings" aria-controls="screen-settings" type="button">Settings</button>
      </nav>
    </header>

    <main class="content">
      <section class="screen" id="screen-ask" role="tabpanel" aria-labelledby="tab-ask" hidden>
        <form id="ask-form" class="form" novalidate>
          <textarea id="ask-input" class="ask-input" rows="3" placeholder="Ask your second brain…" aria-label="Question"></textarea>
          <button class="primary" id="ask-submit" type="submit">Ask</button>
          <p class="message error" id="ask-hint" role="status" aria-live="polite"></p>
        </form>

        <div class="loading" id="ask-loading" role="status" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span>Thinking…</span>
        </div>

        <div class="error-box" id="ask-error" role="alert" hidden>
          <span id="ask-error-text"></span>
          <button class="retry" id="ask-retry" type="button">Retry</button>
        </div>
        <div class="answer" id="answer" aria-live="polite" hidden></div>
      </section>

      <section class="screen" id="screen-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
        <p class="hint" id="auth-status">Signed in.</p>

        <form id="set-password-form" class="form" novalidate>
          <label for="new-password">Add password sign-in</label>
          <input id="new-password" type="password" autocomplete="new-password" placeholder="New password" />
          <input id="new-password-confirm" type="password" autocomplete="new-password" placeholder="Repeat password" />
          <button class="secondary-action" id="set-password-submit" type="submit">Set password</button>
        </form>

        <button class="google" id="google-connect" type="button" hidden>Connect Google account</button>
        <button class="secondary" id="logout" type="button">Log out</button>
        <p class="message" id="settings-message" role="status" aria-live="polite"></p>
        <p class="hint">Queued saves: <span id="queue-count">–</span></p>
      </section>
    </main>

    <footer class="footer">
      <button id="save" class="primary" type="button">Save this page</button>
      <div id="toast" role="status" aria-live="polite"></div>
    </footer>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
