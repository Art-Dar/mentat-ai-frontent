<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Second Brain</title>
  <style>
    body { width: 280px; padding: 16px; font-family: sans-serif; }
    button#save { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #4f46e5; color: #fff; font-size: 14px; cursor: pointer; }
    button#save:disabled { opacity: 0.6; cursor: default; }
    #toast { margin-top: 12px; padding: 8px 10px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity 0.2s; }
    #toast.show { opacity: 1; }
    #toast.success { background: #dcfce7; color: #166534; }
    #toast.error { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <h3>Mentat</h3>
  <button id="save" type="button">Save this page</button>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
