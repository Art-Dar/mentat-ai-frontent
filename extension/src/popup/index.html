<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mentat</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Shown until the user is signed in -->
  <div id="login-view" hidden>
    <header class="header">
      <h1 class="title">Mentat <span class="health-dot checking" role="img" aria-label="Checking server…"></span></h1>
    </header>
    <main class="content">
      <form id="login-form" class="form" novalidate>
        <p class="hint" id="login-hint">Sign in to continue.</p>

        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="username" spellcheck="false" />

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" />

        <div id="confirm-field" hidden>
          <label for="confirm-password">Repeat password</label>
          <input id="confirm-password" type="password" autocomplete="new-password" />
        </div>

        <button class="primary" id="login-submit" type="submit">Log in</button>
        <button class="google" id="google-login" type="button" hidden>Google</button>
        <button class="link" id="toggle-mode" type="button">Create account</button>
        <p class="message" id="login-message" role="status" aria-live="polite"></p>
      </form>
    </main>
  </div>

  <!-- Shown once signed in -->
  <div id="app-view" hidden>
    <header class="header">
      <h1 class="title">Mentat <span class="health-dot checking" role="img" aria-label="Checking server…"></span></h1>
      <nav class="tabs" role="tablist" aria-label="Screens">
        <button class="tab" role="tab" id="tab-ask" data-screen="ask" aria-controls="screen-ask" type="button">Ask</button>
        <button class="tab" role="tab" id="tab-note" data-screen="note" aria-controls="screen-note" type="button">Add</button>
        <button class="tab" role="tab" id="tab-tags" data-screen="tags" aria-controls="screen-tags" type="button">Tags</button>
        <button class="tab" role="tab" id="tab-settings" data-screen="settings" aria-controls="screen-settings" type="button">Settings</button>
      </nav>
    </header>

    <main class="content">
      <section class="screen" id="screen-ask" role="tabpanel" aria-labelledby="tab-ask" hidden>
        <div class="chat-list-view" id="chat-list-view">
          <button class="secondary-action" id="new-chat" type="button">New chat</button>
          <p class="hint" id="chat-list-status" role="status"></p>
          <ul class="chat-list" id="chat-list"></ul>
        </div>

        <div class="chat" id="chat-view" hidden>
          <div class="chat-bar">
            <button class="chat-back" id="chat-back" type="button" aria-label="Back to chats">&#8592;</button>
            <span class="chat-title" id="chat-title">New chat</span>
          </div>
          <div class="chat-log" id="chat-log" role="log" aria-live="polite">
            <p class="chat-empty" id="chat-empty">Ask anything about what you've saved.</p>
          </div>
          <form id="ask-form" class="chat-form" novalidate>
            <textarea id="ask-input" class="ask-input" rows="1" placeholder="Message…" aria-label="Question"></textarea>
            <button class="send" id="ask-submit" type="submit" aria-label="Send">&#10148;</button>
          </form>
        </div>
      </section>

      <section class="screen" id="screen-note" role="tabpanel" aria-labelledby="tab-note" hidden>
        <form id="note-form" class="form" novalidate>
          <input id="note-title" type="text" placeholder="Title (optional)" aria-label="Note title" />
          <textarea id="note-input" class="ask-input" rows="4" placeholder="Write a note…" aria-label="Note"></textarea>
          <button class="primary" id="note-submit" type="submit">Save</button>
          <p class="message" id="note-message" role="status" aria-live="polite"></p>
        </form>

        <form id="upload-form" class="form upload-form" novalidate>
          <label class="dropzone" id="upload-drop" for="upload-file">
            <svg class="drop-icon" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
              <path d="M14 3v5h5" />
              <path d="M9 13h6M9 17h6" />
            </svg>
            <span id="upload-drop-text">Drop a PDF or image, or click to choose</span>
            <input id="upload-file" class="visually-hidden" type="file" />
          </label>
          <div class="upload-row">
            <input id="upload-title" type="text" placeholder="Title" aria-label="File title (optional)" />
            <button class="icon-button" id="upload-submit" type="submit" title="Upload" aria-label="Upload">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 19V5M5 12l7-7 7 7" />
              </svg>
            </button>
          </div>
          <div id="upload-language-field" hidden>
            <label for="upload-language">Language</label>
            <select id="upload-language">
              <option value="eng">English</option>
              <option value="ukr">Ukrainian</option>
              <option value="rus">Russian</option>
              <option value="deu">German</option>
              <option value="fra">French</option>
              <option value="spa">Spanish</option>
              <option value="pol">Polish</option>
            </select>
          </div>
          <p class="message" id="upload-message" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="screen" id="screen-tags" role="tabpanel" aria-labelledby="tab-tags" hidden>
        <p class="hint">Rename to merge.</p>
        <ul class="tag-list" id="tag-list"></ul>
        <p class="message" id="tags-message" role="status" aria-live="polite"></p>
      </section>

      <section class="screen" id="screen-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
        <p class="hint" id="auth-status">Signed in</p>

        <button class="secondary-action" id="password-open" type="button"><svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3M16 7l3 3M14 9l2 2"/></svg>Set password</button>

        <dialog id="password-dialog" class="dialog" aria-labelledby="password-title">
          <form id="set-password-form" class="form" novalidate>
            <h2 class="dialog-title" id="password-title">Set password</h2>
            <input id="new-password" type="password" autocomplete="new-password" placeholder="New password" aria-label="New password" />
            <input id="new-password-confirm" type="password" autocomplete="new-password" placeholder="Repeat password" aria-label="Repeat password" />
            <p class="message" id="password-message" role="status" aria-live="polite"></p>
            <div class="dialog-actions">
              <button class="link" id="password-cancel" type="button">Cancel</button>
              <button class="primary" id="set-password-submit" type="submit">Save</button>
            </div>
          </form>
        </dialog>

        <button class="secondary-action" id="google-connect" type="button" hidden><svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M12 12h9"/></svg>Connect Google</button>
        <button class="secondary" id="logout" type="button"><svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>Log out</button>
        <p class="message" id="settings-message" role="status" aria-live="polite"></p>
        <p class="hint">Server: <span id="health-detail">–</span> <button class="link" id="health-refresh" type="button">Check</button></p>
        <p class="hint">Queued: <span id="queue-count">–</span></p>
      </section>
    </main>

    <footer class="footer">
      <div id="doc-tags" class="doc-tags" hidden>
        <p class="sources-title">Tags</p>
        <div id="doc-tags-list" class="chips"></div>
        <form id="doc-tags-form" class="doc-tags-form">
          <input id="doc-tags-input" type="text" placeholder="Add tags" aria-label="Add tags" />
        </form>
        <p class="message" id="doc-tags-status" role="status" aria-live="polite"></p>
      </div>
    </footer>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
